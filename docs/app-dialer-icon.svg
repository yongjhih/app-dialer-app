<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#18181C"/>
    </linearGradient>

    <!-- Amber Gold Key Gradient -->
    <linearGradient id="goldKey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Grid Keys -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Rounded Rectangle Card Background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGradient)" stroke="#33FFFFFF" stroke-width="4"/>

  <!-- 3x3 Keypad Grid -->
  <!-- Row 1 -->
  <!-- Top-Left Accent Key (Amber Gold) -->
  <rect x="96" y="96" width="88" height="88" rx="20" fill="url(#goldKey)" filter="url(#shadow)"/>
  
  <!-- Top-Center Key -->
  <rect x="212" y="96" width="88" height="88" rx="20" fill="#28282E" stroke="#1AFFFFFF" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Top-Right Key -->
  <rect x="328" y="96" width="88" height="88" rx="20" fill="#28282E" stroke="#1AFFFFFF" stroke-width="2" filter="url(#shadow)"/>

  <!-- Row 2 -->
  <!-- Middle-Left Key -->
  <rect x="96" y="212" width="88" height="88" rx="20" fill="#28282E" stroke="#1AFFFFFF" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Middle-Center Key -->
  <rect x="212" y="212" width="88" height="88" rx="20" fill="#28282E" stroke="#1AFFFFFF" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Middle-Right Key -->
  <rect x="328" y="212" width="88" height="88" rx="20" fill="#28282E" stroke="#1AFFFFFF" stroke-width="2" filter="url(#shadow)"/>

  <!-- Row 3 -->
  <!-- Bottom-Left Key -->
  <rect x="96" y="328" width="88" height="88" rx="20" fill="#28282E" stroke="#1AFFFFFF" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Bottom-Center Key -->
  <rect x="212" y="328" width="88" height="88" rx="20" fill="#28282E" stroke="#1AFFFFFF" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Bottom-Right Key -->
  <rect x="328" y="328" width="88" height="88" rx="20" fill="#28282E" stroke="#1AFFFFFF" stroke-width="2" filter="url(#shadow)"/>
</svg>
